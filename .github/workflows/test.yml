name: test

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check reviewer syntax
        run: node --check force-app/main/default/lwc/writingReviewEngine/writingReviewEngine.js

      - name: Check coach syntax
        run: node --check force-app/main/default/lwc/writingCoach/writingCoach.js

      - name: Run structural engine tests
        run: npm test
